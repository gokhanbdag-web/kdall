name: PHP Core Checks

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kdall_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none
      - name: Lint PHP files
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Run core smoke tests
        run: php tests/smoke.php
      - name: Run MySQL migration integration tests
        env:
          KD_TEST_DB_HOST: 127.0.0.1
          KD_TEST_DB_PORT: 3306
          KD_TEST_DB_NAME: kdall_test
          KD_TEST_DB_USER: root
          KD_TEST_DB_PASS: root
        run: php tests/migrator_integration.php
      - name: Run CRM database integration tests
        env:
          KD_TEST_DB_HOST: 127.0.0.1
          KD_TEST_DB_PORT: 3306
          KD_TEST_DB_NAME: kdall_test
          KD_TEST_DB_USER: root
          KD_TEST_DB_PASS: root
        run: php tests/crm_integration.php
      - name: Run admin shell smoke tests
        run: php tests/admin_shell_smoke.php
      - name: Run CRM customer smoke tests
        run: php tests/customer_module_smoke.php
      - name: Run CRM workspace smoke tests
        run: php tests/crm_workspace_smoke.php
      - name: Run CRM history smoke tests
        run: php tests/crm_history_smoke.php
      - name: Run CRM reports smoke tests
        run: php tests/crm_reports_smoke.php
      - name: Run CRM sales forecast smoke tests
        run: php tests/crm_forecast_smoke.php
      - name: Run CRM reminders smoke tests
        run: php tests/crm_reminders_smoke.php
      - name: Run product inventory smoke tests
        run: php tests/product_module_smoke.php
      - name: Run sales order smoke tests
        run: php tests/order_module_smoke.php
      - name: Run task management smoke tests
        run: php tests/tasks_module_smoke.php
      - name: Run user management smoke tests
        run: php tests/users_module_smoke.php
      - name: Run settings module smoke tests
        run: php tests/settings_module_smoke.php
      - name: Run purchasing module smoke tests
        run: php tests/purchasing_module_smoke.php
      - name: Run finance module smoke tests
        run: php tests/finance_module_smoke.php
      - name: Run customer and supplier ledger smoke tests
        run: php tests/party_ledger_smoke.php
      - name: Run invoice module smoke tests
        run: php tests/invoice_module_smoke.php
      - name: Run marketplace module smoke tests
        run: php tests/marketplace_module_smoke.php
      - name: Run shipping module smoke tests
        run: php tests/shipping_module_smoke.php
      - name: Run returns module smoke tests
        run: php tests/returns_module_smoke.php
      - name: Run sales documents smoke tests
        run: php tests/sales_documents_smoke.php
      - name: Run HR module smoke tests
        run: php tests/hr_module_smoke.php
      - name: Run communications module smoke tests
        run: php tests/communications_module_smoke.php
      - name: Run reports module smoke tests
        run: php tests/reports_module_smoke.php
      - name: Run marketing module smoke tests
        run: php tests/marketing_module_smoke.php
      - name: Run CMS smoke tests
        run: php tests/cms_module_smoke.php
      - name: Lint storefront entrypoint
        run: php -l store.php
      - name: Run payments module smoke tests
        run: php tests/payments_module_smoke.php
      - name: Run payment callback amount tests
        run: php tests/payment_gateway_callback_amount_test.php
      - name: Lint payment callback endpoint
        run: php -l payment_callback.php
      - name: Run notifications module smoke tests
        run: php tests/notifications_module_smoke.php
      - name: Lint automation cron
        run: php -l cron/automation.php
      - name: Run API and webhook smoke tests
        run: php tests/api_webhooks_smoke.php
      - name: Lint API entrypoint
        run: php -l api.php
      - name: Run files module smoke tests
        run: php tests/files_module_smoke.php
      - name: Lint secure download endpoint
        run: php -l download.php
      - name: Run system management smoke tests
        run: php tests/system_module_smoke.php
      - name: Verify generated storage files are ignored
        run: |
          for path in storage/payment.key storage/install.id storage/license.json storage/backups/fixture.sql storage/uploads/fixture.bin .env; do
            git check-ignore -q --no-index "$path" || { echo "Expected ignored runtime path: $path"; exit 1; }
          done
      - name: Lint backup download endpoint
        run: php -l backup_download.php
      - name: Run security module smoke tests
        run: php tests/security_module_smoke.php
      - name: Run data transfer smoke tests
        run: php tests/data_transfer_smoke.php
      - name: Lint CSV export endpoint
        run: php -l export.php
      - name: Run license module smoke tests
        run: php tests/license_module_smoke.php
      - name: Lint license request endpoint
        run: php -l license_request.php
      - name: Lint license tools
        run: php -l tools/generate-license-keypair.php && php -l tools/issue-license.php
      - name: Run audit module smoke tests
        run: php tests/audit_module_smoke.php
      - name: Run POS module smoke tests
        run: php tests/pos_module_smoke.php
      - name: Lint POS API endpoint
        run: php -l pos_api.php
      - name: Run support module smoke tests
        run: php tests/support_module_smoke.php
      - name: Run fixed assets smoke tests
        run: php tests/assets_module_smoke.php
      - name: Run production module smoke tests
        run: php tests/production_module_smoke.php
      - name: Run technical service smoke tests
        run: php tests/service_module_smoke.php
      - name: Run calendar module smoke tests
        run: php tests/calendar_module_smoke.php
      - name: Run quality module smoke tests
        run: php tests/quality_module_smoke.php
      - name: Run accounting module smoke tests
        run: php tests/accounting_module_smoke.php
      - name: Run accounting reports smoke tests
        run: php tests/accounting_reports_smoke.php
      - name: Run accounting automation smoke tests
        run: php tests/accounting_automation_smoke.php
      - name: Run inventory and production costing smoke tests
        run: php tests/inventory_production_costing_smoke.php
      - name: Run multi-warehouse inventory smoke tests
        run: php tests/warehouse_module_smoke.php
      - name: Run warehouse stocktaking smoke tests
        run: php tests/warehouse_stocktaking_smoke.php
      - name: Check JavaScript syntax
        run: node --check assets/admin.js && node --check assets/orders.js
