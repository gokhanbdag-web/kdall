name: Build KodVadAll scope PDF

on:
  push:
    branches: [main]
    paths:
      - "docs/KodVadAll_Tum_Ozellikler.md"
      - "scripts/build_scope_pdf.py"
      - ".github/workflows/build-scope-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependency
        run: pip install reportlab
      - name: Generate designed PDF
        run: python scripts/build_scope_pdf.py
      - name: Commit PDF to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/KodVadAll_Tum_Ozellikler.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
          else
            git commit -m "docs: publish KodVadAll scope PDF"
            git push
          fi
